name: TypeScript

on:
  pull_request:
  push:
    branches: [main, typescript-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/mcp-platforms.yml

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub workflows with pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check shared client and adapters
        run: npm run check
      - name: Package both Codex platforms for review
        env:
          VERIFY_RELEASE_PINS: ${{ github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main' }}
        run: |
          if [[ "$VERIFY_RELEASE_PINS" == true ]]; then
            npm run package:codex -- --verify-pins
          else
            npm run package:codex
          fi
      - name: Audit setup artifacts
        run: npm run check:setup-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-preview-${{ github.sha }}
          path: |
            adapters/mcp/artifacts/codex/flockbot-codex-*.zip
            adapters/mcp/artifacts/codex/flockbot-setup-*.zip
            adapters/mcp/artifacts/codex/flockbot-setup-*.md
            adapters/mcp/artifacts/codex/SHA256SUMS
            adapters/mcp/artifacts/codex/artifacts.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
