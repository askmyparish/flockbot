name: macOS MCP checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    name: MCP on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert target architecture
        run: node -e "if (process.arch !== 'arm64') process.exit(1)"
      - run: npm ci --ignore-scripts
      - name: Offline MCP contracts
        run: npx --no-install vitest run test/mcp
      - run: npm run build:mcp
      - name: Start the built server over stdio
        run: node scripts/mcp/check-package.mjs
