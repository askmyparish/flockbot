name: Platform MCP checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    name: MCP on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert target architecture
        run: |
          node -e "if (process.arch !== (process.platform === 'darwin' ? 'arm64' : 'x64')) process.exit(1)"
      - run: npm ci --ignore-scripts
      - name: Offline MCP contracts
        run: npx --no-install vitest run test/mcp
      - run: npm run build:mcp
      - name: Native setup, corrupt-download rejection and stdio checks
        run: node scripts/mcp/check-browser-package.mjs
