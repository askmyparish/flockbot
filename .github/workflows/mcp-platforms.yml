name: Platform MCP checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    name: MCP on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert target architecture
        run: |
          node -e "if (process.arch !== (process.platform === 'darwin' ? 'arm64' : 'x64')) process.exit(1)"
      - run: npm ci --ignore-scripts
      - name: Offline MCP contracts
        run: npx --no-install vitest run test/mcp
      - run: npm run build:mcp
      - name: Native setup, corrupt-download rejection and stdio checks
        run: node scripts/mcp/check-browser-package.mjs
